<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Wreath Order Form</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .kofc-logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 15px;
        }
        
        .wreath-image {
            max-width: 200px;
            height: auto;
            margin-bottom: 15px;
        }
        
        h1 {
            text-align: center;
            color: #1a472a;
            margin-bottom: 10px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.3em;
            color: #1a472a;
            border-bottom: 2px solid #c41e3a;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .wreath-option {
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .wreath-option:hover {
            border-color: #c41e3a;
            background: #fff5f5;
        }
        
        .wreath-option input[type="radio"] {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .payment-option {
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .payment-option:hover {
            border-color: #c41e3a;
            background: #fff5f5;
        }
        
        .payment-option input[type="radio"] {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .wreath-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .payment-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .wreath-details {
            margin-left: 30px;
        }
        
        .payment-details {
            margin-left: 30px;
        }
        
        .wreath-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #1a472a;
        }
        
        .payment-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #1a472a;
        }
        
        .wreath-description {
            color: #666;
            margin: 5px 0;
            font-size: 0.95em;
        }
        
        .wreath-price {
            color: #c41e3a;
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #1a472a;
            font-weight: bold;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #c41e3a;
            box-shadow: 0 0 5px rgba(196, 30, 58, 0.3);
        }
        
        input[type="date"]:disabled {
            background-color: #f0f0f0;
            color: #333;
            cursor: not-allowed;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .submit-btn {
            background: #c41e3a;
            color: white;
        }
        
        .submit-btn:hover {
            background: #a01830;
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .reset-btn {
            background: #ddd;
            color: #333;
        }
        
        .reset-btn:hover {
            background: #bbb;
        }
        
        .summary {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }
        
        .total-price {
            font-size: 1.3em;
            color: #c41e3a;
            font-weight: bold;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="kofc-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Background -->
                <rect width="200" height="200" fill="#FFC72C"/>
                <!-- Star shape -->
                <polygon points="100,20 130,80 195,80 145,130 175,190 100,145 25,190 55,130 5,80 70,80" fill="#1a3a70"/>
                <!-- Shield -->
                <path d="M 100,60 L 120,80 L 120,120 Q 100,140 100,140 Q 100,140 80,120 L 80,80 Z" fill="white" stroke="#1a3a70" stroke-width="2"/>
                <!-- K inside shield -->
                <text x="100" y="120" font-size="35" font-weight="bold" fill="#1a3a70" text-anchor="middle" dominant-baseline="middle">K</text>
            </svg>
            <img src="https://images.unsplash.com/photo-1609379799319-47f5d4fbb4c5?w=300&h=300&fit=crop" alt="Decorated Wreath" class="wreath-image">
            <h1>Christmas Wreath Order Form</h1>
            <p style="text-align: center; color: #666;">Order your beautiful 24" handcrafted wreaths today!</p>
        </div>
        
        <form id="orderForm">
            <!-- Wreath Selection -->
            <div class="form-section">
                <div class="section-title">Select Your Wreath</div>
                
                <div class="wreath-option">
                    <label class="wreath-label">
                        <input type="radio" name="wreath" value="Plain Mixed Greens - $45" required>
                        <div class="wreath-details">
                            <div class="wreath-name">Plain Mixed Greens Wreath</div>
                            <div class="wreath-description">24" beautiful mixed greens wreath</div>
                            <div class="wreath-price">$45.00</div>
                        </div>
                    </label>
                </div>
                
                <div class="wreath-option">
                    <label class="wreath-label">
                        <input type="radio" name="wreath" value="Decorated Mixed Greens with Pine Cones, Berries & Bow - $65" required>
                        <div class="wreath-details">
                            <div class="wreath-name">Decorated Mixed Greens Wreath</div>
                            <div class="wreath-description">24" mixed greens with pine cones, berries, and bow</div>
                            <div class="wreath-price">$65.00</div>
                        </div>
                    </label>
                </div>
            </div>
            
            <!-- Quantity -->
            <div class="form-section">
                <div class="form-group">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1" required>
                </div>
            </div>
            
            <!-- Payment Method -->
            <div class="form-section">
                <div class="section-title">Select Payment Method</div>
                
                <div class="payment-option">
                    <label class="payment-label">
                        <input type="radio" name="payment" value="Cash" required>
                        <div class="payment-details">
                            <div class="payment-name">Cash</div>
                        </div>
                    </label>
                </div>
                
                <div class="payment-option">
                    <label class="payment-label">
                        <input type="radio" name="payment" value="Check" required>
                        <div class="payment-details">
                            <div class="payment-name">Check</div>
                        </div>
                    </label>
                </div>
                
                <div class="payment-option">
                    <label class="payment-label">
                        <input type="radio" name="payment" value="Venmo" required>
                        <div class="payment-details">
                            <div class="payment-name">Venmo</div>
                        </div>
                    </label>
                </div>
            </div>
            
            <!-- Customer Information -->
            <div class="form-section">
                <div class="section-title">Customer Information</div>
                
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </div>
            
            <!-- Delivery Information -->
            <div class="form-section">
                <div class="section-title">Delivery Information</div>
                
                <div class="form-group">
                    <label for="deliveryDate">Delivery Date:</label>
                    <input type="date" id="deliveryDate" name="deliveryDate" disabled>
                </div>
                
                <div class="form-group">
                    <label for="special">Special Instructions:</label>
                    <textarea id="special" name="special" placeholder="Any special requests or instructions..."></textarea>
                </div>
            </div>
            
            <!-- Order Summary -->
            <div class="summary" id="summary">
                <div>Subtotal: <span id="subtotal">$0.00</span></div>
                <div class="total-price">Total: <span id="total">$0.00</span></div>
            </div>
            
            <!-- Message -->
            <div class="message" id="message"></div>
            
            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="submit-btn" id="submitBtn">Place Order</button>
                <button type="reset" class="reset-btn">Clear Form</button>
            </div>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #666; font-size: 0.9em;">
            Thank you for supporting our Christmas wreath business! 🎅
        </p>
    </div>
    
    <script>
        const wreathPrices = {
            "Plain Mixed Greens - $45": 45,
            "Decorated Mixed Greens with Pine Cones, Berries & Bow - $65": 65
        };
        
        // Google Apps Script Web App URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhlm8clmxV4SdbHFGwIreEk2jBkgaZRzilP6FUUaPVQaejSIsTMx5P9FmAUlCJWdP-5w/exec";
        
        function updateTotal() {
            const selectedWreath = document.querySelector('input[name="wreath"]:checked');
            const quantity = parseInt(document.getElementById('quantity').value) || 1;
            
            if (selectedWreath) {
                const wreathLabel = selectedWreath.value;
                const price = wreathPrices[wreathLabel];
                const subtotal = price * quantity;
                document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
                document.getElementById('total').textContent = '$' + subtotal.toFixed(2);
            }
        }
        
        // Set delivery date to December 5th
        function setDeliveryDate() {
            const year = new Date().getFullYear();
            document.getElementById('deliveryDate').value = year + '-12-05';
        }
        
        // Update total when wreath selection changes
        document.querySelectorAll('input[name="wreath"]').forEach(radio => {
            radio.addEventListener('change', updateTotal);
        });
        
        // Update total when quantity changes
        document.getElementById('quantity').addEventListener('change', updateTotal);
        
        // Handle form submission
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            const formData = new FormData(this);
            const data = {
                timestamp: new Date().toLocaleString(),
                wreath: formData.get('wreath'),
                quantity: formData.get('quantity'),
                payment: formData.get('payment'),
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                deliveryDate: formData.get('deliveryDate'),
                specialInstructions: formData.get('special') || 'None',
                total: document.getElementById('total').textContent
            };
            
            // Send data to Google Apps Script
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => {
                messageDiv.className = 'message success';
                messageDiv.textContent = '✓ Order submitted successfully! We will contact you soon.';
                document.getElementById('orderForm').reset();
                setDeliveryDate();
                updateTotal();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Place Order';
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            })
            .catch(error => {
                messageDiv.className = 'message error';
                messageDiv.textContent = '✗ Error submitting order. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Place Order';
                console.error('Error:', error);
            });
        });
        
        // Initialize
        setDeliveryDate();
        updateTotal();
    </script>
</body>
</html>
