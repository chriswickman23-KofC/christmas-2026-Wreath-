<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas 2026 - Wreath</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .wreath {
            font-size: 5em;
            margin: 20px 0;
        }
        
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            background-color: #c41e3a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        
        .button:hover {
            background-color: #a01830;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wreath">🎄🎄🎄</div>
        <h1>Christmas 2026 - Wreath</h1>
        <p>Welcome to your Christmas Wreath Shop!</p>
        <p>Order your beautiful handcrafted 24" wreaths today.</p>
        <a href="order-form.html" class="button">Place Your Order</a>
    </div>
</body>
</html>
